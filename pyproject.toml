[project]
name = "structured-data-extractor"
version = "0.1.0"
description = "Resilient invoice extraction with Pydantic validation and reflection retries"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3", "openai>=1.60,<3", "instructor>=1.0,<2",
    "pypdf>=5,<7", "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1,<2", "streamlit>=1.40,<2", "json-repair>=0.30,<1",
    "fastapi>=0.110,<1", "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
